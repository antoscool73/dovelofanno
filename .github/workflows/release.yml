name: Rilascio

# Un tag vX.Y.Z produce l'installatore Windows (Inno Setup; runtime .NET di Microsoft, non incluso), le immagini Docker
# esportate in .tar.gz (amd64, arm64: si caricano con docker load, Synology Container Manager o QNAP Container Station
# nel formato classico di docker save, perché Container Station rifiuta l'OCI di buildx), lo zip dei sorgenti e la
# pagina del rilascio. Scelta di Antonio (25 e 27/11/2026): su GitHub vanno solo i sorgenti e le impronte; installatore
# e immagini Docker si scaricano solo da dovelofanno.it, cioè da Cloudflare R2 (download.dovelofanno.it/<versione>/,
# se ci sono i segreti R2_*). Nessuna immagine su ghcr.io.
# Le 0.x e le versioni con trattino (1.0.0-beta.1) escono come pre-release.
# Firma: quando SignPath approva il progetto, l'installatore "unsigned" va firmato tra il job windows e il job release
# (azione signpath/github-action-submit-signing-request, con approvazione manuale su SignPath). Vedi CODE_SIGNING.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  windows:
    name: Pacchetto Windows
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Versione dal tag
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".Substring(1)
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "tag non valido: ${{ github.ref_name }} (atteso vX.Y.Z)" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: site/public/version.json annuncia questa versione
        shell: pwsh
        run: |
          $j = Get-Content site/public/version.json -Raw | ConvertFrom-Json
          if ($j.version -ne "${{ steps.version.outputs.version }}") { throw "site/public/version.json dice $($j.version): aggiornarlo (con data e note) nel commit del tag" }
          if ($j.url -notlike 'https://*') { throw "site/public/version.json: url non https" }

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Interfaccia web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Compilazione
        shell: pwsh
        run: >
          dotnet publish src/DoveLoFanno.Server -c Release -r win-x64 --self-contained false
          -p:Version=${{ steps.version.outputs.version }} -o "$env:RUNNER_TEMP\pkg\app"

      - name: Metadati dei binari
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $bad = Get-ChildItem "$env:RUNNER_TEMP\pkg\app" -Include 'DoveLoFanno*.dll','DoveLoFanno*.exe' -Recurse | ForEach-Object {
            $i = $_.VersionInfo
            "{0}: ProductName={1} ProductVersion={2}" -f $_.Name, $i.ProductName, $i.ProductVersion | Write-Host
            if ($i.ProductName -ne 'DoveLoFanno' -or $i.ProductVersion -ne $v) { $_.Name }
          }
          if ($bad) { throw "metadati sbagliati: $bad" }

      - name: ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Collaudo degli script (installazione, aggiornamento, disinstallazione)
        shell: powershell
        run: .\tools\ci\windows-service-smoke.ps1 -Package "$env:RUNNER_TEMP\pkg\app"

      - name: Installatore
        shell: powershell
        run: .\tools\ci\build-installer.ps1 -Package "$env:RUNNER_TEMP\pkg\app" -Version "${{ steps.version.outputs.version }}" -OutputDir out

      - name: Collaudo dell'installatore (runtime di Microsoft, installazione, aggiornamento, disinstallazione)
        shell: powershell
        run: .\tools\ci\windows-installer-smoke.ps1 -Setup "out\DoveLoFanno-${{ steps.version.outputs.version }}-setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: DoveLoFanno-windows-unsigned
          path: out/*-setup.exe
          if-no-files-found: error

  docker:
    name: Immagini Docker in .tar.gz
    needs: windows
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.windows.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Esportazione (dovelofanno:<versione>, una per architettura)
        run: |
          mkdir -p out
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/${arch}" --cache-from type=gha \
              --label "org.opencontainers.image.version=${VERSION}" \
              --label "org.opencontainers.image.licenses=GPL-3.0-or-later" \
              --build-arg "VERSION=${VERSION}" -t "dovelofanno:${VERSION}" \
              --output "type=docker,dest=oci-${arch}.tar" .
            # formato classico di docker save (una cartella per strato): QNAP Container Station 3 rifiuta
            # quello OCI di buildx con «Invalid File Format» (collaudo su un QNAP vero, 22/11/2026)
            python3 tools/ci/oci-to-docker-archive.py "oci-${arch}.tar" "out/dovelofanno-${VERSION}-docker-${arch}.tar"
            rm "oci-${arch}.tar"
          done
          # compresse: docker load le legge così come sono (circa un terzo da scaricare)
          gzip -6 out/*.tar
          ls -l out

      - name: Collaudo del .tar.gz amd64 (docker load, poi lo stesso collaudo della CI)
        run: |
          docker load -i "out/dovelofanno-${VERSION}-docker-amd64.tar.gz"
          docker image inspect "dovelofanno:${VERSION}" --format '{{.Architecture}}' | grep -qx amd64
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          EXPECT_VERSION="${VERSION}" bash tools/ci/docker-smoke.sh "dovelofanno:${VERSION}"

      - name: Sorgenti
        run: git archive --format=zip --prefix="DoveLoFanno-${VERSION}/" -o "out/DoveLoFanno-${VERSION}-sorgenti.zip" "${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: DoveLoFanno-docker-e-sorgenti
          path: out/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Pagina del rilascio
    needs: [windows, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: DoveLoFanno-windows-unsigned
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: DoveLoFanno-docker-e-sorgenti
          path: out

      - name: Impronte
        run: |
          cd out && sha256sum *.exe *.zip *.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt && ls -l

      # Per il sito (27/11/2026): nomi, dimensioni in byte e impronte dei file, allegati al rilascio. Le pagine della beta
      # li prendono da site/src/data/release.json, che si aggiorna con python tools/site-release.py vX.Y.Z.
      - name: release.json per il sito
        env:
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          cd out && python3 - <<'PY'
          import json, os, re
          v = os.environ['VERSION']
          keys = {f'DoveLoFanno-{v}-setup.exe': 'win-x64', f'dovelofanno-{v}-docker-amd64.tar.gz': 'docker-amd64',
                  f'dovelofanno-{v}-docker-arm64.tar.gz': 'docker-arm64', f'DoveLoFanno-{v}-sorgenti.zip': 'src'}
          files = {}
          for line in open('SHA256SUMS.txt'):
              sha, name = re.match(r'([0-9a-f]{64}) [ *](.+)', line.strip()).groups()
              files[keys[name]] = {'name': name, 'size': os.path.getsize(name), 'sha256': sha}
          assert set(files) == set(keys.values()), files
          json.dump({'version': v, 'base': f'https://download.dovelofanno.it/{v}/', 'files': files},
                    open('release.json', 'w'), indent=2)
          print(open('release.json').read())
          PY

      # Su GitHub solo i sorgenti, le impronte di tutti i file e release.json (scelta di Antonio, 25/11/2026):
      # installatore e immagini Docker si scaricano solo da dovelofanno.it (R2, passo dopo).
      - name: Rilascio su GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          pre=""
          if [[ "$VERSION" == 0.* || "$VERSION" == *-* ]]; then pre="--prerelease"; fi
          cat > notes.md <<EOF
          ## Installazione

          L'installatore per Windows e le immagini Docker (amd64, arm64) si scaricano solo da [dovelofanno.it](https://dovelofanno.it/beta/):
          durante la beta la pagina è riservata a chi la prova (per provarla scrivi a info@dovelofanno.it).
          Qui ci sono i sorgenti di questa versione e le impronte SHA-256 di tutti i file (\`SHA256SUMS.txt\`), per
          controllare quello che hai scaricato. Istruzioni anche in [docs/installazione.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/installazione.md).

          EOF
          gh release create "$GITHUB_REF_NAME" out/*.zip out/SHA256SUMS.txt out/release.json $pre \
            --title "DoveLoFanno $VERSION" --notes-file notes.md --generate-notes --verify-tag

      - name: Copia su Cloudflare R2 (download.dovelofanno.it)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_ENDPOINT" ] || [ -z "$R2_BUCKET" ]; then
            echo "Segreti R2_* assenti: niente copia su R2"; exit 0
          fi
          aws s3 cp out/ "s3://${R2_BUCKET}/${VERSION}/" --recursive --endpoint-url "$R2_ENDPOINT" \
            --exclude "*" --include "*.exe" --include "*.zip" --include "*.tar.gz" --include "SHA256SUMS.txt"
          aws s3 ls "s3://${R2_BUCKET}/${VERSION}/" --endpoint-url "$R2_ENDPOINT"
