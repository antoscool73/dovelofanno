name: Prova QNAP (formato docker save classico)

# Prova temporanea: Container Station 3 di QNAP rifiuta il .tar.gz di buildx (formato OCI) con
# «Invalid File Format». Converte le immagini della 0.2.2 nel formato classico di docker save,
# le collauda e le copia su R2 in /prova-qnap/0.2.2/.
on:
  push:
    branches: [prova-qnap]

permissions:
  contents: read

jobs:
  converti:
    runs-on: ubuntu-latest
    env:
      VERSION: 0.2.2
    steps:
      - uses: actions/checkout@v4

      - name: Scarica le immagini del rilascio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p in out
          gh release download "v${VERSION}" -R "$GITHUB_REPOSITORY" -D in -p '*docker-*.tar.gz'
          ls -l in

      - name: Conversione
        run: |
          for arch in amd64 arm64; do
            python3 tools/ci/oci-to-docker-archive.py "in/dovelofanno-${VERSION}-docker-${arch}.tar.gz" \
              "out/dovelofanno-${VERSION}-docker-${arch}-classico.tar"
            gzip -6 -k "out/dovelofanno-${VERSION}-docker-${arch}-classico.tar"
          done
          ls -l out
          tar tf "out/dovelofanno-${VERSION}-docker-amd64-classico.tar" | grep -v '/layer.tar$' | head -40

      - name: docker load dei file convertiti (arm64, poi amd64 con il collaudo completo)
        run: |
          docker load -i "out/dovelofanno-${VERSION}-docker-arm64-classico.tar"
          docker image inspect "dovelofanno:${VERSION}" --format '{{.Architecture}}' | grep -qx arm64
          docker rmi "dovelofanno:${VERSION}"
          docker load -i "out/dovelofanno-${VERSION}-docker-amd64-classico.tar.gz"
          docker image inspect "dovelofanno:${VERSION}" --format '{{.Architecture}}' | grep -qx amd64
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          bash tools/ci/docker-smoke.sh "dovelofanno:${VERSION}"

      - name: Copia su R2 (/prova-qnap/)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          cd out && sha256sum *-classico.tar *-classico.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          aws s3 cp out/ "s3://${R2_BUCKET}/prova-qnap/${VERSION}/" --recursive --endpoint-url "$R2_ENDPOINT"
          aws s3 ls "s3://${R2_BUCKET}/prova-qnap/${VERSION}/" --endpoint-url "$R2_ENDPOINT"
