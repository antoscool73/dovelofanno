name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Windows: l'oracolo è il codice C# di RegistraTV, che si compila con Windows PowerShell 5.1
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Guida di oggi per l'oracolo
        id: guide
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://epgshare01.online/epgshare01/epg_ripper_IT1.xml.gz' -OutFile "$env:RUNNER_TEMP\guide.xml.gz" -TimeoutSec 120

      - name: Oracolo (RegistraTV, Windows PowerShell 5.1)
        if: steps.guide.outcome == 'success'
        shell: powershell
        run: |
          .\tools\oracle\Export-OracleGuide.ps1 -Guide "$env:RUNNER_TEMP\guide.xml.gz"

      - name: Compilazione
        run: dotnet build DoveLoFanno.slnx -c Release

      - name: Test
        run: dotnet test DoveLoFanno.slnx -c Release --no-build --logger "console;verbosity=normal"
