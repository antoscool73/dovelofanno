name: CI

on:
  push:
    branches: [main]
    tags: ['wave-*', 'v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  # I collaudi di installazione (immagine Docker, servizio e installatore Windows) partono solo se cambia qualcosa che
  # installano, con un tag, con l'avvio a mano o sul primo push di un ramo. Il rilascio (release.yml) li fa sempre.
  # Per risparmiare minuti (23/11/2026, credito gratuito di Actions finito): test e interfaccia web si saltano se il push
  # cambia solo sito, documenti o testi; i test su Windows (contano il doppio) girano solo con un tag (rilascio o
  # wave), con l'avvio a mano o in una PR. Sui push normali basta Linux.
  changes:
    name: File cambiati
    runs-on: ubuntu-latest
    outputs:
      install: ${{ steps.diff.outputs.install }}
      code: ${{ steps.diff.outputs.code }}
      oses: ${{ steps.diff.outputs.oses }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          install=true
          code=true
          if [[ "$GITHUB_REF" != refs/tags/* && "$EVENT" != workflow_dispatch ]]; then
            if [[ "$EVENT" == pull_request ]]; then range="$BASE...$GITHUB_SHA"; else range="$BEFORE..$GITHUB_SHA"; fi
            if git diff --name-only "$range" > "$RUNNER_TEMP/changed"; then
              cat "$RUNNER_TEMP/changed"
              if ! grep -qE '^(deploy/|tools/ci/|Dockerfile$|\.dockerignore$|\.github/workflows/ci\.yml$|global\.json$|Directory\.Build\.props$|src/[^/]+/[^/]+\.csproj$|web/package(-lock)?\.json$)' "$RUNNER_TEMP/changed"; then
                install=false
              fi
              # solo sito, documenti o testi (ma non il contratto dell'API in docs/api): niente da compilare né da collaudare
              if [[ -s "$RUNNER_TEMP/changed" ]] && ! grep -qvE '^(site/|docs/|[^/]+\.md$|LICENSE$|\.github/ISSUE_TEMPLATE/)' "$RUNNER_TEMP/changed" && ! grep -q '^docs/api/' "$RUNNER_TEMP/changed"; then
                code=false
              fi
            fi
          fi
          if [[ "$GITHUB_REF" == refs/tags/* || "$EVENT" == workflow_dispatch || "$EVENT" == pull_request ]]; then
            oses='["windows-latest","ubuntu-latest"]'
          else
            oses='["ubuntu-latest"]'
          fi
          echo "Collaudi di installazione: $install · test e web: $code · sistemi: $oses"
          echo "install=$install" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "oses=$oses" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.oses) }}
    runs-on: ${{ matrix.os }}
    env:
      # le PR da fork non vedono i segreti: per loro l'oracolo dei voti si salta, per il repository è obbligatorio
      DLF_REQUIRE_ORACLE: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      # risposte TMDB registrate (non ridistribuibili): repository privato, chiave di sola lettura
      - name: Dati di prova privati
        if: env.DLF_REQUIRE_ORACLE == '1'
        uses: actions/checkout@v4
        with:
          repository: antoscool73/dovelofanno-testdata
          ssh-key: ${{ secrets.TESTDATA_DEPLOY_KEY }}
          path: tools/oracle/data
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # l'oracolo è il codice C# di RegistraTV, che si compila con Windows PowerShell 5.1: solo su Windows
      - name: Guida di oggi per l'oracolo
        id: guide
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://epgshare01.online/epgshare01/epg_ripper_IT1.xml.gz' -OutFile "$env:RUNNER_TEMP\guide.xml.gz" -TimeoutSec 120

      - name: Oracolo (RegistraTV, Windows PowerShell 5.1)
        if: runner.os == 'Windows' && steps.guide.outcome == 'success'
        shell: powershell
        run: |
          .\tools\oracle\Export-OracleGuide.ps1 -Guide "$env:RUNNER_TEMP\guide.xml.gz"

      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Compilazione
        run: dotnet build DoveLoFanno.slnx -c Release

      - name: Test
        env:
          DLF_REQUIRE_FFMPEG: "1"
          DLF_API_SNAPSHOT_OUT: ${{ runner.temp }}/openapi-v1.json
        run: dotnet test DoveLoFanno.slnx -c Release --no-build --logger "console;verbosity=normal"

      - name: Documento OpenAPI generato
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: openapi-v1
          path: ${{ runner.temp }}/openapi-v1.json
          if-no-files-found: ignore

  web:
    name: Interfaccia web
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Tipi dell'API allineati a docs/api/openapi-v1.json
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts || { echo "::error::schema.d.ts non aggiornato: lanciare npm run gen:api"; exit 1; }
      - name: Controllo dei tipi
        run: npm run check
      - name: Build
        run: npm run build

  docker:
    name: Immagine Docker
    needs: changes
    if: needs.changes.outputs.install == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Immagine per amd64 e arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Immagine amd64 per il collaudo
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dovelofanno:test
          build-args: VERSION=0.0.0-ci
          cache-from: type=gha

      - name: Collaudo del container (installazione, registrazione, riavvio, backup)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          EXPECT_VERSION=0.0.0-ci bash tools/ci/docker-smoke.sh dovelofanno:test

      # Nessuna pubblicazione su ghcr.io (scelta di Antonio, 27/11/2026): le immagini si scaricano solo da
      # dovelofanno.it come .tar.gz, prodotte da release.yml.

  secrets-scan:
    name: Segreti (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks su tutta la cronologia
        run: |
          docker run --rm -v "$PWD:/repo" --entrypoint sh ghcr.io/gitleaks/gitleaks:v8.28.0 \
            -c 'git config --global --add safe.directory /repo && gitleaks git /repo --redact --verbose'

  windows-service:
    name: Servizio Windows
    needs: changes
    if: needs.changes.outputs.install == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: ffmpeg
        run: choco install ffmpeg -y --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Interfaccia web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # senza runtime incluso: l'installatore installa quello di Microsoft (ASP.NET Core 10) se manca
      - name: Pacchetto per Windows
        shell: pwsh
        run: dotnet publish src/DoveLoFanno.Server -c Release -r win-x64 --self-contained false -o "$env:RUNNER_TEMP\pkg"

      - name: Collaudo degli script (installazione, aggiornamento, disinstallazione)
        shell: powershell
        run: .\tools\ci\windows-service-smoke.ps1 -Package "$env:RUNNER_TEMP\pkg"

      - name: Installatore
        shell: powershell
        run: .\tools\ci\build-installer.ps1 -Package "$env:RUNNER_TEMP\pkg" -Version 0.0.0-ci -OutputDir "$env:RUNNER_TEMP\setup"

      - name: Collaudo dell'installatore (runtime di Microsoft, installazione, aggiornamento, disinstallazione)
        shell: powershell
        run: .\tools\ci\windows-installer-smoke.ps1 -Setup "$env:RUNNER_TEMP\setup\DoveLoFanno-0.0.0-ci-setup.exe"
